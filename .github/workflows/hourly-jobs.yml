# Runs the reminder job every hour so evening reminders, friend-streak nudges and poll
# results reach people at the right local time in every time zone. The job is safe to
# repeat: each person gets each message at most once a day. Vercel's daily cron stays
# as a backup.
name: Hourly jobs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminder job
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://persona-90.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl --fail --silent --show-error --max-time 280 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
          else
            curl --fail --silent --show-error --max-time 280 "$SITE_URL/api/cron/reminders"
          fi
